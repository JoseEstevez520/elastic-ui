<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elastic-ui</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="A Vue 3 component library where things transform instead of appearing: a button grows into its dialog, an answer flows in as a wave."
    />
    <meta name="keywords" content="vue, vue3, components, ui, tailwindcss, motion, morph, reka-ui" />
    <meta name="author" content="Jose Estevez" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="elastic-ui" />
    <meta
      property="og:description"
      content="A Vue 3 component library where things transform instead of appearing."
    />
    <meta name="twitter:card" content="summary" />
    <!-- A forced theme without a flash: the choice is read before the page paints (USAGE 16). -->
    <script>
      try {
        const theme = localStorage.getItem('elastic-ui.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
